# OMP settings overlay for the local Ollama coding workers (omp-coder,
# omp-coder-large). Per run, from a checkout or worktree:
#   omp -p --config _agents/models/omp-local-worker.yml \
#     --model ollama/omp-coder-large:latest --thinking high "<task>"
# The same key persisted globally applies to Vibe/task workers after /restart.
# The substring pattern switches only omp-coder* models to the replace
# (old_string/new_string) edit tool; every other model keeps hashline.
edit:
  modelVariants:
    omp-coder: replace
